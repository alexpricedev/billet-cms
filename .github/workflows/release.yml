name: Release

# Publishes @alexpricedev/billet-cms to npm when its version tag is pushed:
#
#   git tag @alexpricedev/billet-cms@0.2.0 && git push origin @alexpricedev/billet-cms@0.2.0
#
# npm trusted publishing (OIDC) authenticates the publish, so no npm token is
# stored anywhere, and npm adds provenance automatically.

on:
  push:
    tags: ["@alexpricedev/billet-cms@*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Tag matches package.json, CHANGELOG has the section, commit is on main
        run: |
          tag="${GITHUB_REF_NAME}"
          want="${tag#@alexpricedev/billet-cms@}"
          have="$(jq -r .version packages/billet-cms/package.json)"
          if [ "$want" != "$have" ]; then
            echo "::error::Tag says $want but packages/billet-cms/package.json says $have. Bump the version first."
            exit 1
          fi
          if ! grep -qx "## $have" packages/billet-cms/CHANGELOG.md; then
            echo "::error::packages/billet-cms/CHANGELOG.md has no '## $have' section."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main. Tag a commit that has been merged."
            exit 1
          fi
          if [ "$(npm view "@alexpricedev/billet-cms@$have" version 2>/dev/null)" = "$have" ]; then
            echo "::error::@alexpricedev/billet-cms@$have is already on npm."
            exit 1
          fi
          echo "version=$have" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v7
      # Trusted publishing needs npm 11.5.1 or later, which Node 24 ships.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish ./packages/billet-cms
      - name: GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{on=0} on' \
            packages/billet-cms/CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "billet-cms $VERSION" --notes-file notes.md
